name: build-uranus-image
on:
  workflow_dispatch:
    inputs:
      adapter_url:
        description: "URL of uranus-lora.gguf (empty = raw base + persona)"
        required: false
        default: ""
      tag:
        description: "image tag"
        required: true
        default: "5.0"
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - name: Free disk (~30 GB more)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/local/lib/node_modules /opt/microsoft /usr/share/swift /usr/local/julia* /opt/az /usr/local/share/powershell /usr/local/share/chromium
          sudo docker image prune -af
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build and push
        run: |
          IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kopro-uranus:${{ inputs.tag }}
          docker build --build-arg ADAPTER_URL="${{ inputs.adapter_url }}" -t $IMG .
          docker push $IMG
          df -h /
